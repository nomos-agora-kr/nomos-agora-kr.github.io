name: sync-and-deploy

# 평일 09~19시(KST) 매시 5분: 법안·표결 증분 갱신 → 변경 있을 때만 재배포
# 매주 월 06:30(KST): 의원·위원회 강제 갱신
on:
  schedule:
    - cron: '5 0-10 * * 1-5'
    - cron: '30 21 * * 0'
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      members:
        description: '의원·위원회 강제 갱신'
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  # 아고라(찬반·한 줄 의견) API (Cloudflare Worker + D1) — 코드 push·수동 실행 때만 배포
  worker:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Skip if Cloudflare secrets missing
        id: chk
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; else echo "skip=false" >> "$GITHUB_OUTPUT"; fi
      - name: Deploy worker
        if: steps.chk.outputs.skip == 'false'
        working-directory: worker
        env:
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          # D1: 있으면 재사용, 없으면 생성
          DB_ID=$(npx wrangler d1 list --json | jq -r '.[] | select(.name=="nomos-agora") | .uuid')
          if [ -z "$DB_ID" ]; then
            npx wrangler d1 create nomos-agora
            DB_ID=$(npx wrangler d1 list --json | jq -r '.[] | select(.name=="nomos-agora") | .uuid')
          fi
          sed -i "s/LOCAL_PLACEHOLDER/$DB_ID/" wrangler.toml
          npx wrangler d1 execute nomos-agora --remote --file=schema.sql
          npx wrangler deploy | tee deploy.log
          echo "$TURNSTILE_SECRET_KEY" | npx wrangler secret put TURNSTILE_SECRET
          URL=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          echo "worker url: $URL"
          test -n "$URL"
          printf '{"api":"%s"}\n' "$URL" > ../public/data/agora.json
      - name: Commit endpoint
        if: steps.chk.outputs.skip == 'false'
        run: |
          git config user.name  "nomos-bot"
          git config user.email "nomos-bot@users.noreply.github.com"
          git checkout -- worker/wrangler.toml   # 배포 때 넣은 DB ID 는 커밋하지 않음
          git add public/data/agora.json
          git commit -m "chore: 아고라 API 주소 갱신" || exit 0
          git pull --rebase -q && git push

  sync:
    needs: worker
    if: always() && github.event_name != 'push' && (needs.worker.result == 'success' || needs.worker.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      changed: ${{ steps.sync.outputs.changed }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install requests==2.32.3
      - id: sync
        env:
          ASSEMBLY_API_KEY: ${{ secrets.ASSEMBLY_API_KEY }}
        run: |
          ARGS=""
          if [ "${{ github.event.schedule }}" = "30 21 * * 0" ] || [ "${{ inputs.members }}" = "true" ]; then ARGS="--members"; fi
          python scripts/sync_bills.py $ARGS
      - name: Commit data
        if: steps.sync.outputs.changed == 'true'
        run: |
          git config user.name  "nomos-bot"
          git config user.email "nomos-bot@users.noreply.github.com"
          git add -A public
          git commit -m "data: 열린국회정보 동기화 $(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M')" || exit 0
          git push

  build:
    needs: sync
    if: >-
      always() && (needs.sync.result == 'skipped' || needs.sync.result == 'success') &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || needs.sync.outputs.changed == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    # sync 가 skipped 면 그 결과가 연쇄 전파되므로, build 성공 여부만 보고 실행
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
